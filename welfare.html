<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Banking & Welfare Info AI</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 400px;
            border: 3px solid #ffcc00; /* 저시력자/시니어를 위한 고대비 포인트 */
        }
        h1 {
            color: #ffcc00;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .status {
            font-size: 18px;
            color: #aaaaaa;
            margin-bottom: 10px;
            height: 24px;
        }
        .display {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 30px;
            border: 2px solid #ffffff;
            white-space: pre-line; /* 복지 세부 정보 줄바꿈 표시용 */
            line-height: 1.5;
        }
        .btn {
            background-color: #ffcc00;
            color: #121212;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #e6b800;
        }
        .btn:disabled {
            background-color: #555555;
            color: #888888;
            cursor: not-allowed;
        }
        .help-text {
            margin-top: 20px;
            font-size: 14px;
            color: #888888;
            text-align: left;
            line-height: 1.6;
            border-top: 1px solid #333333;
            padding-top: 15px;
        }
        .help-text strong {
            color: #ffcc00;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>보이스 뱅킹 & 복지 알리미</h1>
    <div class="status" id="status">버튼을 눌러 시작하세요</div>
    <div class="display" id="display">안녕하세요.<br>말씀하실 준비가 되면 아래 버튼을 눌러주세요.</div>
    <button class="btn" id="voiceBtn">음성 인식 시작</button>
    
    <div class="help-text">
        <strong>[말씀하실 수 있는 명령어 예시]</strong><br>
        • 잔액 조회: "잔액 보여줘", "내 돈 얼마 있어?"<br>
        • 송금 서비스: "백만 원 송금해줘", "이체할래"<br>
        • <strong>정부 복지 정보 조회 (추가됨):</strong><br>
        &nbsp;&nbsp;- "장애인 연금", "기초 연금", "의료비 지원",<br>
        &nbsp;&nbsp;&nbsp;&nbsp;"교통 지원", "긴급복지"
    </div>
</div>

<script>
    const voiceBtn = document.getElementById('voiceBtn');
    const statusDiv = document.getElementById('status');
    const displayDiv = document.getElementById('display');

    // Web Speech API 지원 여부 확인
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const speechSynthesis = window.speechSynthesis;

    // 2026 정부 공개 취약계층 복지 정보 데이터베이스
    const welfareData = {
        handicap: {
            title: "[장애인 연금/수당]",
            voice: "2026년 기준 중증장애인 연금은 월 최대 43만 9,700원이며, 저소득 장애아동수당은 월 최대 22만 원입니다.",
            screen: "[장애인 연금/수당]\n• 중증장애인: 월 최대 439,700원\n• 장애아동수당: 월 최대 220,000원\n• 신청: 주소지 주민센터"
        },
        senior: {
            title: "[노인 기초연금]",
            voice: "2026년 기준 만 65세 이상 소득 하위 70% 어르신께 단독가구 기준 월 최대 34만 9,700원을 지급합니다.",
            screen: "[노인 기초연금]\n• 대상: 만 65세 이상 (하위 70%)\n• 금액: 단독가구 월 최대 349,700원\n• 부부가구 동시 수급 시 20% 감액"
        },
        medical: {
            title: "[의료비 지원]",
            voice: "취약계층 건강보험 본인부담금 감면 및 희귀난치성 질환자 치료비 지원 제도를 운영하고 있습니다.",
            screen: "[의료비 지원]\n• 차상위 희귀질환자 본인부담 면제\n• 노인 안검진 및 개안수술비 지원\n• 문의: 국민건강보험공단"
        },
        traffic: {
            title: "[교통/이동 지원]",
            voice: "장애인 콜택시 바우처 지원 및 만 65세 이상 어르신을 위한 지하철 100% 무임승차 제도가 운영 중입니다.",
            screen: "[교통/이동 지원]\n• 교통약자 전용 콜택시 이용료 지원\n• 만 65세 이상 도시철도 무임승차\n• 무임 교통카드 주민센터 발급"
        },
        emergency: {
            title: "[긴급복지 지원]",
            voice: "생계 곤란 등 위기 상황 발생 시 1인 가구 기준 약 80만 원의 생계비와 최대 300만 원의 의료비를 즉시 지원합니다.",
            screen: "[긴급복지 지원]\n• 위기상황 발생 시 생계비 즉시 지급\n• 의료지원: 최대 300만 원 범위 내\n• 신청: 보건복지상담센터 129"
        }
    };

    if (!SpeechRecognition) {
        statusDiv.innerText = "지원이 되지 않는 브라우저입니다.";
        voiceBtn.disabled = true;
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'ko-KR';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        voiceBtn.addEventListener('click', () => {
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel(); // 안내 도중 누르면 음성 끄고 바로 마이크 켜기
            }
            recognition.start();
        });

        recognition.onstart = () => {
            statusDiv.innerText = "듣고 있습니다...";
            voiceBtn.disabled = true;
            displayDiv.innerText = "말씀해 주세요...";
        };

        recognition.onerror = (event) => {
            console.error(event.error);
            statusDiv.innerText = "에러가 발생했습니다.";
            displayDiv.innerText = "다시 시도해 주세요.";
            voiceBtn.disabled = false;
        };

        recognition.onend = () => {
            statusDiv.innerText = "인식 완료";
            voiceBtn.disabled = false;
        };

        recognition.onresult = (event) => {
            const speechResult = event.results[0][0].transcript.toLowerCase();
            statusDiv.innerText = `인식된 말: "${speechResult}"`;
            processCommand(speechResult);
        };
    }

    // 서비스 안내 음성 출력 함수 (시니어를 고려해 약 0.95배속으로 편안하게 설정)
    function speak(text) {
        if (speechSynthesis.speaking) {
            speechSynthesis.cancel();
        }
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95; 
        speechSynthesis.speak(utterance);
    }

    // 명령 분석 및 복지 조회 처리 로직 (핵심 추가/수정 파트)
    function processCommand(command) {
        // 1. 기존 금융 서비스 분기
        if (command.includes('잔액') || command.includes('얼마')) {
            const reply = "현재 계좌 잔액은 350만 원입니다.";
            displayDiv.innerText = reply;
            speak(reply);
        } 
        else if (command.includes('송금') || command.includes('이체')) {
            const reply = "송금 단계를 진행합니다. 받으실 분의 은행을 말씀해 주세요.";
            displayDiv.innerText = reply;
            speak(reply);
        }
        // 2. 신규 복지 정보 조회 서비스 분기 (음성 패턴 매칭)
        else if (command.includes('장애인') || command.includes('수당')) {
            showWelfare(welfareData.handicap);
        } 
        else if (command.includes('기초') || command.includes('노인')) {
            showWelfare(welfareData.senior);
        } 
        else if (command.includes('의료') || command.includes('병원') || command.includes('치료')) {
            showWelfare(welfareData.medical);
        } 
        else if (command.includes('교통') || command.includes('지하철') || command.includes('택시')) {
            showWelfare(welfareData.traffic);
        } 
        else if (command.includes('긴급') || command.includes('복지지원')) {
            showWelfare(welfareData.emergency);
        } 
        // 3. 예외 처리
        else {
            const reply = "알아듣지 못했습니다. 잔액조회, 송금 또는 원하시는 복지 메뉴를 다시 말씀해 주세요.";
            displayDiv.innerText = reply;
            speak(reply);
        }
    }

    // 복지 정보를 화면(고대비 텍스트)과 음성(TTS)으로 동시에 출력하는 처리 함수
    function showWelfare(targetData) {
        displayDiv.innerText = targetData.screen; // 화면 출력 (CSS white-space속성으로 줄바꿈 정상 작동)
        speak(targetData.voice);                   // 음성 출력
    }
</script>

</body>
</html>
